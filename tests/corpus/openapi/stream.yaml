openapi: 3.2.0
info:
  title: Stream
  version: "1.0.0"
servers:
  - url: https://example.test
paths:
  /search:
    query:
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - q
              properties:
                q:
                  type: string
      responses:
        "200":
          description: Matching records
          content:
            application/jsonl:
              itemSchema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid
