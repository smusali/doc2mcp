parameters:
  Limit:
    name: limit
    in: query
    required: false
    description: Maximum number of results
    schema:
      type: integer
      format: int32
      minimum: 1
      maximum: 100
      default: 20
components:
  schemas:
    Pet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          enum:
            - cat
            - dog
          example: cat
