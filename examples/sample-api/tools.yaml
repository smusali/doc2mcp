- name: upload_book_file
  title: Upload Book File
  description: Upload a file and attach it to a book.
  intent: Upload a book file
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
  inputs:
  - name: book_id
    schema:
      type: string
    description: book id
    required: true
    maps_to:
      endpoint_id: PUT /books/{book_id}/file
      param: book_id
      in: path
  - name: content_type
    schema:
      type: string
    description: content type
    required: true
    maps_to:
      endpoint_id: POST /uploads
      param: content_type
      in: body
  - name: data
    schema:
      contentEncoding: base64
      type: string
    description: data
    required: true
    maps_to:
      endpoint_id: PUT /uploads/{upload_id}/parts/{part_number}
      param: data
      in: body
  - name: filename
    schema:
      type: string
    description: filename
    required: true
    maps_to:
      endpoint_id: POST /uploads
      param: filename
      in: body
  fixed:
  - endpoint_id: PUT /uploads/{upload_id}/parts/{part_number}
    param: part_number
    in: path
    value: 1
    reason: single part
  steps:
  - endpoint_id: POST /uploads
    bind: []
  - endpoint_id: PUT /uploads/{upload_id}/parts/{part_number}
    bind:
    - param: upload_id
      in: path
      ref: $steps[0].body.id
  - endpoint_id: POST /uploads/{upload_id}/complete
    bind:
    - param: upload_id
      in: path
      ref: $steps[0].body.id
  - endpoint_id: PUT /books/{book_id}/file
    bind:
    - param: upload_id
      in: body
      ref: $steps[0].body.id
  output:
    from_step: 3
    fields:
    - book_id
    - file_id
    schema:
      additionalProperties: false
      properties:
        book_id:
          type: string
        file_id:
          type: string
      type: object
      required:
      - book_id
      - file_id
  verify:
    example_args:
      book_id: example
      content_type: example
      data: example
      filename: example
    depends_on: []
  rationale: Upload Book File is a primary Shelf action.
