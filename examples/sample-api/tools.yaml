- name: add_copy
  title: Add Copy
  description: Add a copy of a book.
  intent: Add a copy
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
  inputs:
  - name: barcode
    schema:
      type: string
    description: barcode
    required: true
    maps_to:
      endpoint_id: POST /books/{book_id}/copies
      param: barcode
      in: body
  - name: book_id
    schema:
      type: string
    description: book id
    required: true
    maps_to:
      endpoint_id: POST /books/{book_id}/copies
      param: book_id
      in: path
  fixed: []
  steps:
  - endpoint_id: POST /books/{book_id}/copies
    bind: []
  output:
    from_step: 0
    fields:
    - barcode
    - book_id
    - created_at
    - id
    - status
    schema:
      additionalProperties: false
      properties:
        barcode:
          type: string
        book_id:
          type: string
        created_at:
          type: string
        id:
          type: string
        status:
          enum:
          - available
          - on_loan
          type: string
      type: object
      required:
      - barcode
      - book_id
      - created_at
      - id
      - status
  verify:
    example_args:
      barcode: example
      book_id: example
    depends_on: []
  rationale: Add Copy is a primary Shelf action.
