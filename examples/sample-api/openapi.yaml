openapi: "3.1.0"
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Shelf
  version: "1.0.0"
  description: Small library circulation API used as the doc2mcp sample.
servers:
  - url: http://127.0.0.1:8765
    description: In-memory reference server
tags:
  - name: books
    description: Catalog records
  - name: copies
    description: Physical copies
  - name: reviews
    description: Patron reviews
  - name: patrons
    description: Library patrons
  - name: holds
    description: Wait list
  - name: loans
    description: Checked-out copies
  - name: uploads
    description: File upload sessions
  - name: admin
    description: Operator-only operations
security:
  - apiKeyAuth: []
paths:
  /books:
    get:
      tags: [books]
      operationId: listBooks
      summary: List books
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of books
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [books]
      operationId: createBook
      summary: Create a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreate"
      responses:
        "201":
          description: Created book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /books/{book_id}:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: [books]
      operationId: getBook
      summary: Read a book
      responses:
        "200":
          description: Book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [books]
      operationId: updateBook
      summary: Update a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdate"
      responses:
        "200":
          description: Updated book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [books]
      operationId: deleteBook
      summary: Delete a book
      responses:
        "200":
          description: Deleted book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deletion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /books/{book_id}/stats:
    get:
      tags: [books]
      operationId: getBookStats
      summary: Read book statistics
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Book statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookStats"
              example:
                book_id: book_001
                page_count: 320
                word_count: 84000
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /books/{book_id}/page-count:
    get:
      tags: [books]
      operationId: getBookPageCount
      summary: Read a book's page count
      description: Superseded by getBookStats.
      deprecated: true
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Page count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookPageCount"
              example:
                book_id: book_001
                page_count: 320
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /books/{book_id}/copies:
    get:
      tags: [copies]
      operationId: listCopies
      summary: List copies of a book
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of copies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [copies]
      operationId: createCopy
      summary: Add a copy of a book
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyCreate"
      responses:
        "201":
          description: Created copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Copy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /books/{book_id}/file:
    put:
      tags: [books]
      operationId: attachBookFile
      summary: Attach a completed upload to a book
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookFileAttach"
      responses:
        "200":
          description: Attached file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /books/{book_id}/reviews:
    get:
      tags: [reviews]
      operationId: listReviews
      summary: List reviews of a book
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [reviews]
      operationId: createReview
      summary: Review a book
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCreate"
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /books/{book_id}/loans:
    get:
      tags: [loans]
      operationId: listBookLoans
      summary: List loans of a book
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of loans
          content:
            application/json:
