  /admin/patrons/{patron_id}/reinstate:
    post:
      tags: [admin]
      operationId: reinstatePatron
      summary: Reinstate a patron
      parameters:
        - $ref: "#/components/parameters/PatronId"
      responses:
        "200":
          description: Reinstated patron
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patron"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/circulation:
    get:
      tags: [admin]
      operationId: getCirculation
      summary: Read circulation counts
      responses:
        "200":
          description: Circulation counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Circulation"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Send the sample key in this header.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque id of the last item on the previous page. Omit it to read the first page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 2
    BookId:
      name: book_id
      in: path
      required: true
      schema:
        type: string
    CopyId:
      name: copy_id
      in: path
      required: true
      schema:
        type: string
    ReviewId:
      name: review_id
      in: path
      required: true
      schema:
        type: string
    PatronId:
      name: patron_id
      in: path
      required: true
      schema:
        type: string
    HoldId:
      name: hold_id
      in: path
      required: true
      schema:
        type: string
    LoanId:
      name: loan_id
      in: path
      required: true
      schema:
        type: string
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
    PartNumber:
      name: part_number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: The request was not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The API key header is missing or wrong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    Deletion:
      type: object
      additionalProperties: false
      required: [id, deleted]
