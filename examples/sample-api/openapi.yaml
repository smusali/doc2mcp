      tags: [holds]
      operationId: listHolds
      summary: List holds for a patron
      parameters:
        - $ref: "#/components/parameters/PatronId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of holds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
