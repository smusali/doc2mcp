repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: ^mcp4api/
        pass_filenames: false
        args: [--strict, mcp4api]
        additional_dependencies:
          - anthropic==2.3.0
          - typer==0.27.3
          - pydantic==2.14.1
          - PyYAML==6.0.3
          - types-PyYAML==6.0.12.20260906
          - httpx2==2.16.0
          - jinja2==3.1.6
          - markupsafe==3.0.4
          - openapi-spec-validator==0.9.0
          - jsonschema==4.26.0
          - jsonschema-rs==0.60.1
          - types-jsonschema==4.26.0.20261006
          - mcp==2.3.0
          - hypothesis==6.170.12
          - hypothesis-jsonschema==0.23.2
          - rich==15.0.0
