name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi

      - name: Cassettes stay scrubbed
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E -n -e 'shelf-sample-key' -e 'Authorization' examples/sample-api/tests/cassettes; then
            echo "cassette contains a credential"
            exit 1
          fi

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: |
          uv run mypy --strict mcp4api
          uv run mypy --strict examples/sample-api/generated/shelf_mcp

      - name: Test
        run: uv run pytest

  fixture:
    name: fixture
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.fixture.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Detect sample API
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          if [ -f examples/sample-api/report/verification.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  self-run:
    name: self-run
    needs: fixture
    if: needs.fixture.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Compare the sample tree
        shell: bash
        run: |
          set -euo pipefail
          cp -a examples/sample-api "$RUNNER_TEMP/out"
          set +e
          uv run mcp4api examples/sample-api/openapi.yaml --offline --deterministic --out "$RUNNER_TEMP/out"
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "expected exit 3, got $code"
            exit 1
          fi
          diff -r --exclude=.mcp4api examples/sample-api "$RUNNER_TEMP/out"

  determinism:
    name: determinism
    needs: fixture
    if: needs.fixture.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Diff two runs
        shell: bash
        run: |
          set -euo pipefail
          run_once() {
            dest="$1"
            rm -rf "$dest"
            cp -a examples/sample-api "$dest"
            set +e
            uv run mcp4api examples/sample-api/openapi.yaml --offline --deterministic --out "$dest"
            code=$?
            set -e
            if [ "$code" -ne 3 ]; then
              echo "expected exit 3, got $code"
              exit 1
            fi
          }
          run_once "$RUNNER_TEMP/one"
          run_once "$RUNNER_TEMP/two"
          diff -r --exclude=.mcp4api "$RUNNER_TEMP/one" "$RUNNER_TEMP/two"

  readme:
    name: readme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.15"
          enable-cache: true

      - name: No placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -riE "coming soon|\bTBD\b|\bWIP\b" README.md docs/; then
            echo "placeholder wording"
            exit 1
          fi

      - name: Install
        run: uv sync --frozen --extra dev

      - name: README snippets
        run: uv run python tools/check_readme_snippets.py

      - name: README links
        run: uv run python tools/check_pypi_readme.py

      - name: Build
        run: uv build

      - name: Twine
        run: uvx twine check dist/*

      - name: Quickstart
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          env -u ANTHROPIC_API_KEY uvx --from . mcp4api examples/sample-api/openapi.yaml --offline --out examples/sample-api
          code=$?
          set -e
          cat examples/sample-api/report/verification.md
          end=$(date +%s)
          elapsed=$((end - start))
          echo "elapsed ${elapsed}s"
          if [ "$code" -ne 3 ]; then
            echo "expected exit 3, got $code"
            exit 1
          fi
          if [ "$elapsed" -ge 60 ]; then
            echo "quickstart took ${elapsed}s"
            exit 1
          fi
          uv run python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("examples/sample-api/report/verification.json").read_text(encoding="utf-8")
          )
          summary = report["summary"]
          if summary["generated"] != 15 or summary["verified"] != 14 or summary["gaps"] != 1:
              raise SystemExit(f"unexpected summary: {summary}")
          if report["excluded"] != ["get_book"]:
              raise SystemExit(f"unexpected excluded: {report['excluded']}")
          failures = report["failures"]
          if not failures or any(
              item["tool"] != "get_book" or item["field"] != "page_count" for item in failures
          ):
              raise SystemExit("expected only get_book page_count failures")
          PY
