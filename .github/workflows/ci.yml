name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get install -y bubblewrap

      - name: Install
        run: uv sync --frozen --group dev --no-editable

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Test
        run: uv run pytest

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --group dev --no-editable

      - name: Changelog
        run: uv run python tools/check_changelog.py

      - name: Schemas
        run: uv run python tools/export_schemas.py --check

      - name: Dependencies
        run: uv run deptry src

      - name: Readme
        run: uv run python tools/check_readme_snippets.py

      - name: Build
        run: uv build

      - name: Wheel
        run: uv run python tools/check_wheel.py

      - name: Sample
        run: uv run python tools/check_sample.py --runs 2 --timed 60

      - name: Installed sample
        run: uv run python tools/check_sample.py --command

  check:
    name: check
    if: always()
    needs: [test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require green jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$TEST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
