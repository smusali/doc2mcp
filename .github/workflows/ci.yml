name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy --strict doc2mcp

      - name: Test
        run: uv run pytest

  fixture:
    name: fixture
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.fixture.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Detect sample API
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          if [ -f examples/sample-api/report/verification.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  self-run:
    name: self-run
    needs: fixture
    if: needs.fixture.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Compare exit code and report
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run doc2mcp examples/sample-api/openapi.yaml --offline --deterministic --out "$RUNNER_TEMP/out"
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "expected exit 3, got $code"
            exit 1
          fi
          diff -u \
            examples/sample-api/expected/report/verification.json \
            "$RUNNER_TEMP/out/report/verification.json"

  determinism:
    name: determinism
    needs: fixture
    if: needs.fixture.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Diff two runs
        shell: bash
        run: |
          set -euo pipefail
          run_once() {
            dest="$1"
            set +e
            uv run doc2mcp examples/sample-api/openapi.yaml --offline --deterministic --out "$dest"
            code=$?
            set -e
            if [ "$code" -ne 3 ]; then
              echo "expected exit 3, got $code"
              exit 1
            fi
          }
          run_once "$RUNNER_TEMP/one"
          run_once "$RUNNER_TEMP/two"
          diff -r "$RUNNER_TEMP/one" "$RUNNER_TEMP/two"
